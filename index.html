<script>const c=document.getElementById('s'),x=c.getContext('2d');let w,h,S=[];function r(){w=c.width=innerWidth;h=c.height=innerHeight;S=Array.from({length:Math.min(400,w*h/3000)},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()*2+.3,t:Math.random()*6}))}addEventListener('resize',r);r();
